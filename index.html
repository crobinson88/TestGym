<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gym" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Gym Tracker</title>
    <script>
      // Apply the stored theme before first paint so a light-mode reload never
      // flashes the dark palette. Mirrors lib/theme.ts.
      (function () {
        try {
          var light = localStorage.getItem("theme") === "light";
          var root = document.documentElement;
          root.classList.toggle("light", light);
          root.classList.toggle("dark", !light);
          root.style.colorScheme = light ? "light" : "dark";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", light ? "#f7f7f8" : "#0a0a0a");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
